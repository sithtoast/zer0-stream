name: Publish Media Worker Image

on:
  push:
    branches: [main]
    paths:
      - "media_worker/**"
      - "boombox_runtime/**"
      - ".github/workflows/publish-media.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/zer0-stream-media
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: media_worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=zer0-stream-media
          cache-to: type=gha,mode=max,scope=zer0-stream-media

  deploy:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Notify Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          curl --fail-with-body -k -X POST "$PORTAINER_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "status": "success",
              "images": ["${{ secrets.DOCKER_USERNAME }}/zer0-stream-media:latest"],
              "commit": "${{ github.sha }}",
              "branch": "${{ github.ref_name }}"
            }'
