name: Publish LL-HLS Testing Images

on:
  push:
    branches: [codex/llhls-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llhls-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/codex/llhls-foundation'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: zer0-stream
            context: zer0_stream
            dockerfile: zer0_stream/Dockerfile
          - image: zer0-stream-media
            context: .
            dockerfile: media_worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Testing image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=llhls-foundation
            type=raw,value=llhls-${{ github.sha }}
      - name: Build and publish testing image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llhls-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=llhls-${{ matrix.image }}
      # Deployment is deliberately separate. No production tag or webhook.
