services:
  app:
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      PHX_HOST: ${PHX_HOST:?PHX_HOST is required}
      PORT: ${PORT:-4000}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      DB_STARTUP_RETRIES: ${DB_STARTUP_RETRIES:-30}
      DB_STARTUP_DELAY: ${DB_STARTUP_DELAY:-2}

  media_worker:
    build:
      context: ..
      dockerfile: media_worker/Dockerfile
    ports:
      - "${RTMP_PORT:-1935}:1935"
      - "${HLS_HTTP_PORT:-8080}:8080"
    environment:
      MIX_ENV: prod
      CONTROL_PLANE_URL: http://app:${PORT:-4000}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:?PLAYBACK_TOKEN_SECRET is required}
    depends_on:
      - app
    restart: unless-stopped