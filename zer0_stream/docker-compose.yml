services:
  app:
    build: .
    image: sithtoast/zer0-stream:latest
    container_name: zer0-stream
    ports:
      - "4000:4000"
    environment:
      MIX_ENV: prod
      PHX_SERVER: "true"
      PHX_HOST: localhost
      PORT: 4000
      SECRET_KEY_BASE: changeme
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PLAYBACK_BASE_URL: http://localhost:8080
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-dev-playback-secret}
      MAIN_APP_AUTH_SECRET: ${MAIN_APP_AUTH_SECRET:-dev-main-app-auth-secret}
      CONTROL_PLANE_AUTH_SECRET: ${CONTROL_PLANE_AUTH_SECRET:-dev-control-plane-auth-secret}
    restart: unless-stopped

  media_worker:
    build:
      context: ..
      dockerfile: media_worker/Dockerfile
    image: sithtoast/zer0-stream-media:latest
    container_name: zer0-stream-media
    ports:
      - "1935:1935"
      - "8080:8080"
    environment:
      MIX_ENV: prod
      CONTROL_PLANE_URL: http://app:4000
      CONTROL_PLANE_AUTH_SECRET: ${CONTROL_PLANE_AUTH_SECRET:-dev-control-plane-auth-secret}
      HLS_ALLOWED_ORIGINS: ${HLS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4000}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET:-dev-playback-secret}
    depends_on:
      - app
    restart: unless-stopped
